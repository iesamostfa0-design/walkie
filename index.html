<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لاسلكي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>لاسلكي</title>
<style>
[hidden]{display:none!important}
:root{
  --bg:#07090c; --bg2:#0d1117;
  --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.06);
  --line:rgba(226,184,102,.18); --line2:rgba(255,255,255,.08);
  --gold:#e2b866; --gold-hi:#f6dca0; --gold-lo:#b8873a;
  --ivory:#f3ede0; --mute:#8d8777;
  --green:#2fd08a; --red:#ff5a5f;
  --glow:226,184,102;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(900px 520px at 50% -8%, rgba(226,184,102,.12), transparent 62%),
    radial-gradient(700px 500px at 100% 110%, rgba(47,208,138,.05), transparent 60%),
    linear-gradient(#07090c,#0a0d12);
  background-attachment:fixed;
  color:var(--ivory);
  font-family:"Noto Sans Arabic","Segoe UI","Cairo",Tahoma,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,textarea{font:inherit;color:inherit}
h1,h2,p{margin:0}

#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.screen{display:none;min-height:100dvh;padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 18px);animation:fade .35s ease both}
.screen.active{display:flex;flex-direction:column}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- الشاشة الأولى ---------- */
.hero{text-align:center;padding:38px 0 22px}
.logo{display:inline-grid;place-items:center;filter:drop-shadow(0 0 28px rgba(226,184,102,.35))}
.logo .w1{animation:pulse 2.6s ease-in-out infinite}
.logo .w2{animation:pulse 2.6s ease-in-out .35s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1{
  font-size:2.6rem;font-weight:800;letter-spacing:.02em;margin-top:10px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tag{color:var(--mute);line-height:1.9;margin-top:8px;font-size:1rem}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.85rem;color:var(--mute);margin-bottom:8px}
.field input{
  width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line2);
  background:rgba(0,0,0,.35);font-size:1.05rem;outline:none;transition:border-color .2s, box-shadow .2s;
}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,184,102,.15)}
.foot{color:var(--mute);font-size:.85rem;text-align:center;line-height:1.9;margin-top:auto;padding-top:26px}
.notice{
  margin-top:14px;padding:14px 16px;border-radius:14px;line-height:1.8;font-size:.92rem;
  background:rgba(255,90,95,.09);border:1px solid rgba(255,90,95,.35);color:#ffc9cb;
}

/* ---------- الأزرار ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;margin-top:10px;border-radius:16px;border:1px solid transparent;
  font-weight:700;font-size:1.05rem;cursor:pointer;transition:transform .1s, opacity .2s, filter .2s;
}
.btn:active{transform:scale(.98);opacity:.9}
.btn.gold{
  color:#20170a;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  box-shadow:0 10px 26px rgba(226,184,102,.28), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn.ghost{background:var(--card2);border-color:var(--line);color:var(--gold-hi)}
.btn.quiet{background:transparent;border-color:var(--line2);color:var(--mute);font-weight:600}
.btn.mini{padding:9px 14px;font-size:.9rem;margin:8px 0 14px;width:auto;background:var(--card2);border-color:var(--line);color:var(--gold-hi)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--ivory);cursor:pointer}

/* ---------- الرأس ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-size:1.15rem}
.brand b{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.pill{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--ivory)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 2s infinite}
.pill.off .dot{background:var(--mute);box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.35}}

.me{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line2)}
.me b{display:block;font-size:1rem}
.me small{color:var(--mute);font-size:.78rem}
.netq{margin-inline-start:auto;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px}

.avatar{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:1.1rem;color:#1a1306;
  background:linear-gradient(150deg,var(--gold-hi),var(--gold-lo));
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}

/* ---------- الأجهزة المتصلة ---------- */
.peers{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none;min-height:92px}
.peers::-webkit-scrollbar{display:none}
.peer{
  flex:none;min-width:118px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:border-color .2s, box-shadow .2s, background .2s;
}
.peer b{font-size:.92rem;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peer small{font-size:.72rem;color:var(--mute)}
.peer.talking{border-color:rgba(47,208,138,.7);background:rgba(47,208,138,.08);box-shadow:0 0 26px rgba(47,208,138,.22)}
.peer.talking .avatar{animation:bob .8s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.08)}}
.empty{width:100%;text-align:center;color:var(--mute);font-size:.92rem;line-height:1.8;padding:18px 10px;border:1px dashed var(--line2);border-radius:18px}

.sig{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.sig i{width:4px;border-radius:1px;background:rgba(255,255,255,.14)}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}
.sig[data-l="1"] i:nth-child(-n+1),.sig[data-l="2"] i:nth-child(-n+2),
.sig[data-l="3"] i:nth-child(-n+3),.sig[data-l="4"] i:nth-child(-n+4){background:var(--gold)}
.sig[data-l="4"] i,.sig[data-l="3"] i:nth-child(-n+3){}
.sig[data-l="1"] i:nth-child(1){background:var(--red)}

/* ---------- زر التحدث ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px 0}
.ptt-wrap{position:relative;width:min(60vw,248px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(var(--glow),.8);opacity:0;pointer-events:none}
.ptt-wrap.talking{--glow:255,90,95}
.ptt-wrap.listening{--glow:47,208,138}
.ptt-wrap.talking .ring,.ptt-wrap.listening .ring{animation:ripple 2s ease-out infinite}
.ptt-wrap .ring:nth-child(2){animation-delay:.65s!important}
.ptt-wrap .ring:nth-child(3){animation-delay:1.3s!important}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}

#ptt{
  position:relative;width:100%;height:100%;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:conic-gradient(from 210deg,#3a3120,#e2b866 18%,#6a5225 36%,#f6dca0 55%,#43371f 74%,#e2b866 92%,#3a3120);
  box-shadow:0 26px 60px rgba(0,0,0,.65), 0 0 60px rgba(var(--glow),.16);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .12s ease, box-shadow .25s ease;
}
#ptt::before{
  content:"";position:absolute;inset:9px;border-radius:50%;
  background:radial-gradient(circle at 50% 28%,#1d2430,#0a0d12 72%);
  box-shadow:inset 0 3px 22px rgba(0,0,0,.9), inset 0 -2px 10px rgba(226,184,102,.06);
}
.face{position:relative;display:grid;place-items:center;gap:8px;color:var(--gold);transition:color .2s}
.plabel{font-weight:700;font-size:1.05rem;color:var(--ivory)}
.ptt-wrap.talking #ptt{transform:scale(.965);box-shadow:0 18px 50px rgba(0,0,0,.7), 0 0 90px rgba(255,90,95,.5);
  background:conic-gradient(from 210deg,#4a1d1f,#ff5a5f 18%,#7a2a2d 36%,#ffb3b5 55%,#4a1d1f 74%,#ff5a5f 92%,#4a1d1f)}
.ptt-wrap.talking .face{color:var(--red)}
.ptt-wrap.listening #ptt{box-shadow:0 26px 60px rgba(0,0,0,.65), 0 0 90px rgba(47,208,138,.4);
  background:conic-gradient(from 210deg,#143528,#2fd08a 18%,#1b5a41 36%,#a7f0cf 55%,#143528 74%,#2fd08a 92%,#143528)}
.ptt-wrap.listening .face{color:var(--green)}

.status{min-height:1.7em;text-align:center;color:var(--mute);font-size:.98rem;line-height:1.7;padding:0 8px}
.status b{color:var(--ivory)}
.eq{display:flex;align-items:center;justify-content:center;gap:3px;height:38px;direction:ltr}
.eq i{width:4px;height:4px;border-radius:2px;background:linear-gradient(var(--gold-hi),var(--gold-lo));opacity:.55;transition:height .07s linear}

.bar{display:flex;gap:10px;align-items:center}
.bar .btn{margin-top:0}
.bar .btn.ghost{flex:1}
.bar .btn.quiet{width:auto;padding-inline:22px}

/* ---------- الانضمام والنوافذ ---------- */
.steps{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
.steps i{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.steps i.on{background:linear-gradient(90deg,var(--gold-hi),var(--gold-lo))}
h2{font-size:1.35rem;text-align:center;font-weight:800;margin-bottom:8px}
.lead{color:var(--mute);text-align:center;line-height:1.85;margin-bottom:18px;font-size:.96rem}

.qrbox{
  margin:0 auto 14px;background:#fff;border-radius:22px;padding:14px;width:fit-content;max-width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(226,184,102,.4);
}
.qrbox canvas{display:block;image-rendering:pixelated;max-width:100%;height:auto}
.scanbox{
  position:relative;margin:0 auto 14px;width:min(100%,340px);aspect-ratio:1;border-radius:26px;overflow:hidden;background:#000;
  box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(226,184,102,.4);
}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:16%;pointer-events:none;
  background:
    linear-gradient(var(--gold),var(--gold)) top right/26px 3px no-repeat,
    linear-gradient(var(--gold),var(--gold)) top right/3px 26px no-repeat,
    linear-gradient(var(--gold),var(--gold)) top left/26px 3px no-repeat,
    linear-gradient(var(--gold),var(--gold)) top left/3px 26px no-repeat,
    linear-gradient(var(--gold),var(--gold)) bottom right/26px 3px no-repeat,
    linear-gradient(var(--gold),var(--gold)) bottom right/3px 26px no-repeat,
    linear-gradient(var(--gold),var(--gold)) bottom left/26px 3px no-repeat,
    linear-gradient(var(--gold),var(--gold)) bottom left/3px 26px no-repeat;
}
.frame::after{content:"";position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);box-shadow:0 0 14px var(--gold);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%{top:4%}50%{top:94%}100%{top:4%}}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mute);padding:8px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(226,184,102,.25);border-top-color:var(--gold);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,4,6,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{
  width:100%;max-width:480px;max-height:94dvh;overflow:auto;
  background:linear-gradient(#10141b,#0a0d12);border:1px solid var(--line);border-bottom:0;
  border-radius:30px 30px 0 0;padding:10px 20px calc(var(--safe-b) + 20px);animation:up .35s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 14px}

.manual{margin-top:16px;border-top:1px solid var(--line2);padding-top:12px;font-size:.9rem}
.manual summary{cursor:pointer;color:var(--mute);padding:6px 0}
.manual label{display:block;color:var(--mute);margin:10px 0 6px;font-size:.82rem}
.manual textarea{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line2);border-radius:12px;padding:10px;color:var(--ivory);font-size:.72rem;resize:none;word-break:break-all}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:40;
  background:rgba(20,24,32,.96);border:1px solid var(--line);color:var(--ivory);padding:11px 18px;border-radius:999px;
  font-size:.92rem;max-width:88vw;text-align:center;transition:opacity .25s, transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.hero{padding:16px 0 12px}.logo svg{width:84px;height:84px}h1{font-size:2.1rem}.ptt-wrap{width:min(52vw,210px)}}

</style>
</head>
<body>
<main id="app">

  <!-- ============ الشاشة الأولى ============ -->
  <section id="s-welcome" class="screen active">
    <div class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="112" height="112">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f6dca0"/><stop offset="1" stop-color="#b8873a"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="56" fill="none" stroke="url(#g1)" stroke-opacity=".25" stroke-width="1.5"/>
          <path d="M33 60a27 27 0 0 1 27-27M87 60a27 27 0 0 1-27 27" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round" class="w1"/>
          <path d="M20 60a40 40 0 0 1 40-40M100 60a40 40 0 0 1-40 40" fill="none" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" stroke-opacity=".6" class="w2"/>
          <circle cx="60" cy="60" r="9" fill="url(#g1)"/>
        </svg>
      </div>
      <h1>لاسلكي</h1>
      <p class="tag">تواصل صوتي مباشر بين الهواتف<br>من غير إنترنت ومن غير تسجيل</p>
    </div>

    <div class="card">
      <label class="field">
        <span>اسمك في الشبكة</span>
        <input id="name" maxlength="16" autocomplete="off" placeholder="مثلًا: أحمد">
      </label>
      <button class="btn gold" id="btn-create">ابدأ شبكة جديدة</button>
      <button class="btn ghost" id="btn-join">انضم لشبكة بمسح الباركود</button>
    </div>

    <div class="notice" id="notice" hidden></div>
    <p class="foot">كل الهواتف لازم تكون على نفس الواي فاي،<br>أو على نقطة اتصال (هوت سبوت) من أحدها.</p>
  </section>

  <!-- ============ شاشة اللاسلكي ============ -->
  <section id="s-radio" class="screen">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 120 120" width="26" height="26" aria-hidden="true">
          <path d="M33 60a27 27 0 0 1 27-27M87 60a27 27 0 0 1-27 27" fill="none" stroke="#e2b866" stroke-width="9" stroke-linecap="round"/>
          <circle cx="60" cy="60" r="11" fill="#e2b866"/>
        </svg>
        <b>لاسلكي</b>
      </div>
      <div class="pill"><i class="dot"></i><span id="count">أنت فقط</span></div>
    </header>

    <div class="me">
      <span class="avatar" id="me-av"></span>
      <div><b id="me-name"></b><small>أنت</small></div>
      <div class="netq" id="netq"><small>قوة الشبكة</small><span class="sig" id="net-sig" data-l="0"><i></i><i></i><i></i><i></i></span></div>
    </div>

    <div class="peers" id="peers"></div>

    <div class="stage" id="stage">
      <div class="ptt-wrap" id="pttwrap">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
        <button id="ptt" aria-label="اضغط مطولًا للتحدث">
          <span class="face">
            <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>
            </svg>
            <span class="plabel" id="plabel">اضغط للتحدث</span>
          </span>
        </button>
      </div>
      <div class="status" id="status"></div>
      <div class="eq" id="eq" aria-hidden="true"></div>
    </div>

    <footer class="bar">
      <button class="btn ghost" id="btn-add">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        إضافة جهاز
      </button>
      <button class="btn quiet" id="btn-leave">خروج</button>
    </footer>
  </section>

  <!-- ============ شاشة الانضمام ============ -->
  <section id="s-join" class="screen">
    <header class="top">
      <button class="icon-btn" id="join-back" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="brand"><b>الانضمام لشبكة</b></div>
      <span style="width:40px"></span>
    </header>

    <div class="steps" id="join-steps"><i class="on"></i><i></i></div>
    <h2 id="join-title"></h2>
    <p class="lead" id="join-desc"></p>

    <div class="scanbox" id="join-scan" hidden><video id="vid-join" playsinline muted></video><div class="frame"></div></div>
    <div class="qrbox" id="join-qr" hidden><canvas id="qr-join"></canvas></div>
    <div class="wait" id="join-wait" hidden><i class="spin"></i><span>بنكمّل الاتصال…</span></div>

    <details class="manual" id="join-manual">
      <summary>الكاميرا مش شغالة؟ استخدم النص بدل الباركود</summary>
      <label>الصق نص الجهاز الأول هنا</label>
      <textarea class="paste" dir="ltr" rows="3"></textarea>
      <button class="btn mini ok">تأكيد</button>
      <label>نصّك أنت (ابعته للجهاز الأول)</label>
      <textarea class="own" dir="ltr" rows="3" readonly></textarea>
      <button class="btn mini copy">نسخ</button>
    </details>
  </section>

  <!-- ============ نافذة إضافة جهاز ============ -->
  <div class="sheet" id="sheet-add" hidden>
    <div class="sheet-in">
      <div class="grab"></div>
      <div class="steps" id="add-steps"><i class="on"></i><i></i></div>
      <h2 id="add-title"></h2>
      <p class="lead" id="add-desc"></p>

      <div class="qrbox" id="add-qr"><canvas id="qr-add"></canvas></div>

		offset++;

	for (var i = 0; i < num.length - offset; i++) {

	}

	get : function(index) {
		return this.num[index];

	getLength : function() {
		return this.num.length;

	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);

			for (var j = 0; j < e.getLength(); j++) {

		if (this.getLength() - e.getLength() < 0) {
			return this;

  }
};

/* ======================= الاتصال (WebRTC) ======================= */
function gather(pc, ms = 2500) {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const done = () => { clearTimeout(t); pc.removeEventListener('icegatheringstatechange', on); res(); };
    const on = () => { if (pc.iceGatheringState === 'complete') done(); };
    const t = setTimeout(done, ms);
    pc.addEventListener('icegatheringstatechange', on);
  });
}

function makeLink(id, name, initiator) {
  const pc = new RTCPeerConnection({ iceServers: [] }); // شبكة محلية: مش محتاجين سيرفرات
  const link = { id, name, pc, dc: null, initiator, up: false, adder: false, rtt: null, talking: false, audioEl: null, an: null, dropTimer: 0, dead: false };
  pc.addTrack(S.track, S.stream);
  pc.ontrack = e => attachRemote(link, e.streams[0] || new MediaStream([e.track]));
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'failed' || s === 'closed') dropLink(link);
    else if (s === 'disconnected') { clearTimeout(link.dropTimer); link.dropTimer = setTimeout(() => { if (pc.connectionState !== 'connected') dropLink(link); }, 5000); }
    else if (s === 'connected') clearTimeout(link.dropTimer);
  };
  if (initiator) bindDC(link, pc.createDataChannel('mesh'));
  else pc.ondatachannel = e => bindDC(link, e.channel);
  return link;
}

function bindDC(link, dc) {
  link.dc = dc;
  dc.onopen = () => {
    link.up = true;
    send(link, { t: 'hi', id: me.id, name: me.name });
    if (link.adder) { // الجهاز اللي أضاف الجديد بيعرّفه على باقي الأجهزة
      send(link, { t: 'roster', peers: [...S.links.values()].filter(l => l !== link && l.up).map(l => ({ id: l.id, name: l.name })) });
    }
    onLinkUp(link);
  };
  dc.onclose = () => dropLink(link);
  dc.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } handleMsg(link, m); };
}

function send(link, obj) { try { if (link.dc && link.dc.readyState === 'open') link.dc.send(JSON.stringify(obj)); } catch (e) {} }
function broadcast(obj) { for (const l of S.links.values()) if (l.up) send(l, obj); }

function attachRemote(link, stream) {
  if (!link.audioEl) { const a = document.createElement('audio'); a.autoplay = true; a.setAttribute('playsinline', ''); document.body.appendChild(a); link.audioEl = a; }
  link.audioEl.srcObject = stream; link.audioEl.play().catch(() => {});
  try { const an = S.ac.createAnalyser(); an.fftSize = 64; S.ac.createMediaStreamSource(stream).connect(an); link.an = an; } catch (e) {}
}

function dropLink(link) {
  if (link.dead) return; link.dead = true;
  clearTimeout(link.dropTimer);
  try { link.dc && link.dc.close(); } catch (e) {}
  try { link.pc.close(); } catch (e) {}
  if (link.audioEl) { link.audioEl.srcObject = null; link.audioEl.remove(); }
  const wasUp = link.up; link.up = false;
  if (link.id && S.links.get(link.id) === link) S.links.delete(link.id);
  if (S.pending === link) S.pending = null;
  if (S.joinLink === link) { S.joinLink = null; if (S.screen === 'join') { toast('الاتصال فشل، جرّب تاني'); leaveJoin(); } }
  if (wasUp && link.name) toast(link.name + ' خرج من الشبكة');
  renderAll();
}

function onLinkUp(link) {
  renderAll();
  if (S.screen === 'join' && S.joinLink === link) { Scanner.stop(); S.joinLink = null; showScreen('radio'); toast('اتصلت بالشبكة ✅'); beep(660, 90); setTimeout(() => beep(990, 120), 110); }
  else if (link.name) toast(link.name + ' اتصل ✅');
}

function handleMsg(link, m) {
  switch (m.t) {
    case 'hi':
      link.name = String(m.name || 'جهاز').slice(0, 16); renderAll(); break;
    case 'roster':
      for (const p of (m.peers || [])) if (p.id !== me.id && !S.links.has(p.id)) startRelayed(p);
      break;
    case 'sig': routeSig(link, m); break;
    case 'talk':
      link.talking = !!m.on; if (m.on) beep(660, 60); else beep(440, 60);
      renderAll(); break;
  }
}

/* --- توصيل الأجهزة ببعض عن طريق الأجهزة اللي متصلة فعلًا (من غير باركود تاني) --- */
function sendSig(to, kind, sdp) {
  const m = { t: 'sig', m: rid(), to, from: me.id, name: me.name, kind, sdp, ttl: 3 };
  S.seen.add(m.m);
  const direct = S.links.get(to);
  if (direct && direct.up) send(direct, m); else broadcast(m);
}
function routeSig(from, m) {
  if (m.to === me.id) { handleSig(m); return; }
  if (S.seen.has(m.m) || m.ttl <= 0) return;
  S.seen.add(m.m); m.ttl--;
  const direct = S.links.get(m.to);
  if (direct && direct.up) send(direct, m);
  else for (const l of S.links.values()) if (l !== from && l.up) send(l, m);
}
async function startRelayed(p) {
  try {
    const link = makeLink(p.id, p.name, true); S.links.set(p.id, link);
    await link.pc.setLocalDescription(await link.pc.createOffer());
    await gather(link.pc);
    sendSig(p.id, 'offer', link.pc.localDescription.sdp);
    setTimeout(() => { if (!link.up && !link.dead) dropLink(link); }, 20000);
  } catch (e) { console.warn(e); }
}
async function handleSig(m) {
  try {
    if (m.kind === 'offer') {
      const ex = S.links.get(m.from);
      if (ex) {
        if (ex.up && ex.pc.connectionState === 'connected') return;
        if (ex.initiator && !ex.up && me.id < m.from) return; // لو الاتنين بدأوا مع بعض، صاحب الرقم الأصغر هو اللي يكمل
        dropLink(ex);
      }
      const link = makeLink(m.from, m.name, false); S.links.set(m.from, link);
      await link.pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
      await link.pc.setLocalDescription(await link.pc.createAnswer());
      await gather(link.pc);
      sendSig(m.from, 'answer', link.pc.localDescription.sdp);
      setTimeout(() => { if (!link.up && !link.dead) dropLink(link); }, 20000);
    } else if (m.kind === 'answer') {
      const l = S.links.get(m.from);
      if (l && l.initiator && l.pc.signalingState === 'have-local-offer') await l.pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
    }
  } catch (e) { console.warn(e); }
}

/* ======================= إضافة جهاز (من جهاز موجود في الشبكة) ======================= */
async function openAdd() {
  try { await ensureMedia(); } catch (e) { toast('الميكروفون مش شغال'); return; }
  $('#sheet-add').hidden = false;
  setAddStep(1);
  const link = makeLink(null, null, true); link.adder = true; link.nonce = rid(); S.pending = link;
  try {
    await link.pc.setLocalDescription(await link.pc.createOffer());
    await gather(link.pc);
    const text = await pack({ v: 1, k: 'o', x: link.nonce, i: me.id, n: me.name, d: slim(link.pc.localDescription.sdp) });
    if (S.pending !== link) return;
    drawQR($('#qr-add'), text);
    $('#add-manual .own').value = text;
  } catch (e) {
    toast(e.message === 'nonet' ? 'مفيش شبكة واي فاي متصلة. وصّل الواي فاي أو شغّل الهوت سبوت' : 'حصلت مشكلة في تجهيز الباركود');
    closeAdd();
  }
}
function setAddStep(n) {
  document.querySelectorAll('#add-steps i').forEach((el, i) => el.classList.toggle('on', i < n));
  $('#add-qr').hidden = n !== 1; $('#add-scan').hidden = n !== 2;
  $('#add-title').textContent = n === 1 ? 'خلي الجهاز الجديد يمسح الباركود ده' : 'امسح باركود الجهاز الجديد';
  $('#add-desc').textContent = n === 1
    ? 'على الجهاز الجديد افتح التطبيق واضغط «انضم لشبكة بمسح الباركود» وصوّب الكاميرا على الباركود.'
    : 'الجهاز الجديد دلوقتي بيعرض باركود. صوّب الكاميرا عليه عشان يكمّل الاتصال.';
  $('#add-next').hidden = n !== 1;
}
async function addNext() {
  setAddStep(2); S.scanMode = 'add';
  try { await Scanner.start($('#vid-add'), onScanned); }
  catch (e) { scanFailed(e, '#add-manual', '#add-scan'); }
}
function closeAdd() {
  Scanner.stop(); $('#sheet-add').hidden = true; S.scanMode = null;
  if (S.pending && !S.pending.id) { const p = S.pending; S.pending = null; p.dead = true; try { p.pc.close(); } catch (e) {} }
}

/* ======================= الانضمام (من الجهاز الجديد) ======================= */
async function startJoin() {
  try { await ensureMedia(); } catch (e) { showNotice(explainMediaError(e)); return; }
  me.name = readName();
  showScreen('join'); setJoinStep(1); S.scanMode = 'join';
  try { await Scanner.start($('#vid-join'), onScanned); }
  catch (e) { scanFailed(e, '#join-manual', '#join-scan'); }
}
function setJoinStep(n) {
  document.querySelectorAll('#join-steps i').forEach((el, i) => el.classList.toggle('on', i < n));
  $('#join-scan').hidden = n !== 1; $('#join-qr').hidden = n !== 2; $('#join-wait').hidden = n !== 2;
  $('#join-title').textContent = n === 1 ? 'امسح باركود الشبكة' : 'خلي الجهاز التاني يمسح الباركود ده';
  $('#join-desc').textContent = n === 1
    ? 'على أي جهاز في الشبكة اضغط «إضافة جهاز» وصوّب كاميرتك على الباركود اللي هيظهر.'
    : 'الجهاز اللي في الشبكة دلوقتي بيفتح الكاميرا. صوّبها على الباركود ده وبعدها هتتصل أوتوماتيك.';
}
function leaveJoin() {
  Scanner.stop(); S.scanMode = null;
  if (S.joinLink) { const l = S.joinLink; S.joinLink = null; l.dead = true; try { l.pc.close(); } catch (e) {} }
  showScreen(S.links.size ? 'radio' : 'welcome');
}

function scanFailed(e, manualSel, scanSel) {
  $(scanSel).hidden = true;
  $(manualSel).open = true;
  if (e && e.message === 'nodetector') toast('المتصفح مش بيقرا الباركود. استخدم النص بدل الكاميرا', 4200);
  else if (e && e.name === 'NotAllowedError') toast('اسمح للكاميرا من إعدادات Chrome، أو استخدم النص', 4200);
  else toast('الكاميرا مش شغالة. استخدم النص بدل الباركود', 4200);
}

/* ======================= معالجة اللي اتمسح ======================= */
async function onScanned(text) {
  try {
    if (!S.track) await ensureMedia();
    const o = await unpack(text);
    if (o.v !== 1) throw new Error('bad');
    if (S.scanMode === 'join' && o.k === 'o') await acceptOffer(o);
    else if (S.scanMode === 'add' && o.k === 'a') await acceptAnswer(o);
    else { toast(S.scanMode === 'add' ? 'ده مش باركود الجهاز الجديد، جرّب تاني' : 'ده مش باركود شبكة، جرّب تاني'); restartScan(); }
  } catch (e) {
    console.warn(e); toast('الباركود مش مقروء، جرّب تاني'); restartScan();
  }
}
function restartScan() {
  if (S.scanMode === 'join' && S.screen === 'join') Scanner.start($('#vid-join'), onScanned).catch(() => {});
  else if (S.scanMode === 'add' && !$('#sheet-add').hidden) Scanner.start($('#vid-add'), onScanned).catch(() => {});
}

async function acceptOffer(o) {           // الجهاز الجديد: استلم عرض → يجهز رد
  const link = makeLink(o.i, o.n, false); S.joinLink = link; S.links.set(o.i, link);
  setJoinStep(2);
  await link.pc.setRemoteDescription({ type: 'offer', sdp: o.d });
  await link.pc.setLocalDescription(await link.pc.createAnswer());
  await gather(link.pc);
  const text = await pack({ v: 1, k: 'a', x: o.x, i: me.id, n: me.name, d: slim(link.pc.localDescription.sdp) });
  drawQR($('#qr-join'), text);
  $('#join-manual .own').value = text;
  setTimeout(() => { if (S.joinLink === link && !link.up) { toast('الاتصال أخد وقت طويل، جرّب من الأول'); dropLink(link); } }, 60000);
}
async function acceptAnswer(o) {          // الجهاز الموجود: استلم الرد → يكمّل الاتصال
  const link = S.pending; if (!link) return;
  if (o.x !== link.nonce) { toast('ده رد لباركود قديم. اعمل الخطوات من الأول'); restartScan(); return; }
  await link.pc.setRemoteDescription({ type: 'answer', sdp: o.d });
  link.id = o.i; link.name = o.n; S.links.set(o.i, link); S.pending = null;
  $('#sheet-add').hidden = true; S.scanMode = null;
  toast('جاري الاتصال…'); renderAll();
}

/* ======================= الشاشة الرئيسية ======================= */
function sigLevel(l) {
  if (!l.up) return 0; if (l.rtt == null) return 3;
  return l.rtt < 30 ? 4 : l.rtt < 80 ? 3 : l.rtt < 200 ? 2 : 1;
}
function countText(n) { // n = عدد الأجهزة الأخرى
  const t = n + 1;
  if (n === 0) return 'أنت فقط';
  if (t === 2) return 'جهازين متصلين';
  if (t <= 10) return t + ' أجهزة متصلة';
  return t + ' جهاز متصل';
}
function renderAll() {
  const ups = [...S.links.values()].filter(l => l.up);
  $('#count').textContent = countText(ups.length);
  $('.pill').classList.toggle('off', ups.length === 0);
  $('#me-name').textContent = me.name; const av = $('#me-av'); av.textContent = initial(me.name); av.setAttribute('style', avatarStyle(me.id));

  const box = $('#peers');
  if (!ups.length) box.innerHTML = '<div class="empty">مفيش أجهزة متصلة لسه.<br>اضغط «إضافة جهاز» وخلي صاحبك يمسح الباركود.</div>';
  else box.innerHTML = ups.map(l => `
    <div class="peer ${l.talking ? 'talking' : ''}">
      <span class="avatar" style="${avatarStyle(l.id)}">${esc(initial(l.name))}</span>
      <b>${esc(l.name || 'جهاز')}</b>
      <span class="sig" data-l="${sigLevel(l)}"><i></i><i></i><i></i><i></i></span>
      <small>${l.rtt == null ? 'متصل' : Math.max(1, Math.round(l.rtt)) + ' مللي ثانية'}</small>
    </div>`).join('');

  const avg = ups.length ? Math.round(ups.reduce((a, l) => a + sigLevel(l), 0) / ups.length) : 0;
  $('#net-sig').dataset.l = avg;
  updateStage();
}
function updateStage() {
  const ups = [...S.links.values()].filter(l => l.up);
  const talker = ups.find(l => l.talking);
  const w = $('#pttwrap');
  w.classList.toggle('talking', S.talking);
  w.classList.toggle('listening', !S.talking && !!talker);
  $('#plabel').textContent = S.talking ? 'أنت على الهواء' : talker ? 'استقبال' : 'اضغط للتحدث';
  $('#status').innerHTML = S.talking ? 'بتتكلم دلوقتي… <b>سيب الزر</b> لما تخلص'
    : talker ? `<b>${esc(talker.name || 'جهاز')}</b> بيتكلم…`
    : ups.length ? 'جاهز. اضغط مطولًا وتكلم' : 'ضيف جهاز الأول عشان تقدر تتكلم';
}

/* ======================= زر التحدث ======================= */
function startTalk() {
  if (S.talking || !S.track) return;
  S.talking = true; S.track.enabled = true;
  broadcast({ t: 'talk', on: true }); vibrate(25); beep(880, 70); updateStage();
}
function stopTalk() {
  if (!S.talking) return;
  S.talking = false; S.track.enabled = false;
  broadcast({ t: 'talk', on: false }); beep(520, 70); updateStage();
}
const ptt = $('#ptt');
ptt.addEventListener('pointerdown', e => { e.preventDefault(); try { ptt.setPointerCapture(e.pointerId); } catch (_) {} startTalk(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => ptt.addEventListener(ev, stopTalk));
ptt.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', stopTalk);

/* المؤشر الصوتي (equalizer) */
const eq = $('#eq'); for (let i = 0; i < 28; i++) eq.appendChild(document.createElement('i'));
const bars = [...eq.children], buf = new Uint8Array(32);
(function loop() {
  requestAnimationFrame(loop);
  if (S.screen !== 'radio') return;
  let an = null;
  if (S.talking) an = S.localAn; else { const t = [...S.links.values()].find(l => l.talking && l.an); an = t && t.an; }
  if (an) an.getByteFrequencyData(buf);
  bars.forEach((b, i) => {
    const mirror = i < 14 ? 13 - i : i - 14;           // متماثل من النص
    const v = an ? buf[Math.min(31, Math.floor(mirror * 1.6))] / 255 : 0;
    b.style.height = (4 + v * 34) + 'px'; b.style.opacity = an ? .5 + v * .5 : .35;
  });
})();

/* قياس جودة الاتصال لكل جهاز */
setInterval(async () => {
  if (S.screen !== 'radio') return;
  for (const l of S.links.values()) {
    if (!l.up) continue;
    try {
      const st = await l.pc.getStats(); let rtt = null;
      st.forEach(r => { if (r.type === 'candidate-pair' && r.nominated && r.currentRoundTripTime != null) rtt = r.currentRoundTripTime * 1000; });
      l.rtt = rtt;
    } catch (e) {}
  }
  renderAll();
}, 2500);

/* ======================= ربط الأزرار ======================= */
function readName() {
  const v = $('#name').value.trim().slice(0, 16) || ('جهاز ' + (10 + Math.floor(Math.random() * 90)));
  store('walkie-name', v); return v;
}
$('#name').value = store('walkie-name') || '';

$('#btn-create').onclick = async () => {
  showNotice('');
  try { await ensureMedia(); } catch (e) { showNotice(explainMediaError(e)); return; }
  me.name = readName(); showScreen('radio'); renderAll();
};
$('#btn-join').onclick = () => { showNotice(''); startJoin(); };
$('#join-back').onclick = leaveJoin;
$('#btn-add').onclick = openAdd;
$('#add-next').onclick = addNext;
$('#add-close').onclick = closeAdd;
$('#sheet-add').addEventListener('click', e => { if (e.target.id === 'sheet-add') closeAdd(); });
$('#btn-leave').onclick = () => {
  if (!confirm('تخرج من الشبكة؟')) return;
  stopTalk(); for (const l of [...S.links.values()]) dropLink(l);
  S.links.clear(); showScreen('welcome');
};

/* الطريقة اليدوية (لو الكاميرا مش شغالة) */
function wireManual(sel, handler) {
  const box = $(sel);
  box.querySelector('.ok').onclick = () => { const v = box.querySelector('.paste').value.trim(); if (v) handler(v); };
  box.querySelector('.copy').onclick = async () => {
    const ta = box.querySelector('.own'); ta.select();
    try { await navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); }
    toast('اتنسخ ✅');
  };
}
wireManual('#join-manual', v => { S.scanMode = 'join'; onScanned(v); });
wireManual('#add-manual', v => { S.scanMode = 'add'; onScanned(v); });

window.addEventListener('pagehide', () => { for (const l of S.links.values()) { try { l.pc.close(); } catch (e) {} } });

// تسجيل ملف العمل بدون إنترنت (بيشتغل بس على https أو localhost)
try { if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

// للاختبار فقط
window.__w = { S, me, pack, unpack, drawQR, onScanned };

if (!window.isSecureContext) showNotice('الصفحة مش في وضع آمن، فالميكروفون والكاميرا مش هيشتغلوا.<br>افتحها من <b>Chrome</b> على رابط يبدأ بـ <b>localhost</b>.');
})();

</script>
